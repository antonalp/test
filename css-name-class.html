<!-- 
        Основные правила нейминга.
Нельзя:
1.	В именах нельзя использовать цифры (class-1);
2.	Имя класса не должно состоять из одной буквы;
3.	В имени класса не стоит злоупотреблять сокращениями (.btn);
4.	Имя класса не должно дублировать имя элемента, к которому применяется (<p class=”p”), исключение: структурные элементы;
Можно
1.	Имя класса лучше писать в кебаб-кейс нотации, где каждое слово разделено символом дефиса;
2.	Имя класса должно отражать его функцию или стиль(<button class=”red-button>);
3.	Имя класса может состоять из нескольких слов, по количеству без ограничений, однако, логично, чем меньше имя, тем проще его написать, читать и запомнить;
4.	В именах классов можно комбинировать слова, если этого требует контекст элемента (<div class=”user”> <img class=”user-image”><div class=”user-name”>);
5.	Для имен классов лучше использовать существительное, в редких случаях прилагательное, например, когда класс является неким модификатором компонента, глаголы не используют вовсе;
6.	Существование каждого класса должно быть оправдано, например, если у нас есть 5 абсолютно одинаковых по стилю секций, но с разным наполнением, то не стоит придумывать собственный класс, лучше обойтись одним унифицированным.
 -->

 <!-- Структурные (верхний уровень разметки) -->

<body class="page">
  <header class="header">
    <nav class="menu"></nav><!-- или class="navigation", или class="nav" -->
  </header>
  <main class="content"> <!-- или class="main" -->
     <section class="section"></section> <!-- если у секций есть какой-то повторяющийся паттерн стилей, например,вертикальные отступы -->
     <section class="section">
      <div class="section-inner"></div>
      <!-- или class="section-body" -->
      <!-- такой же <span> -->
     </section>
     <section class="section">
      <div class="user">
        <div class="user-image-wrapper">
          <!-- или class="user-image-wrap" -->
          <img class="user-image">

        </div>
      </div>
     </section>
     <section class="section"></section>
     <section class="section"></section>
     <aside class="sidebar"></aside> <!-- или class="widget", или class="aside" -->
  </main> 
  <footer class="footer"></footerclass>
</body>
